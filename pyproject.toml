[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "training-bot"
version = "0.1.0"
description = "Telegram training journal with database-backed analytics"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.20,<4", "openai>=2,<3", "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3",
  "openpyxl>=3.1,<4", "imageio-ffmpeg>=0.6,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
training-bot = "training_bot.cli:main"

[tool.setuptools.packages.find]
include = ["training_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
